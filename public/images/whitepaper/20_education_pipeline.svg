<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a0a14"/><stop offset="100%" stop-color="#06060c"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrowW" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/></marker>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#00f0ff"><line x1="0" y1="400" x2="1200" y2="400" stroke-dasharray="2,8"/></g>
  <text x="600" y="42" text-anchor="middle" fill="#00f0ff" font-size="11" letter-spacing="4" opacity="0.6">CHAPTER 12 — LAYER U</text>
  <text x="600" y="72" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold" letter-spacing="1">EDUCATION PIPELINE</text>
  <text x="600" y="96" text-anchor="middle" fill="#ffffff" font-size="13" opacity="0.5">Narrative → Mechanical → Economic → Transfer Readiness</text>

  <!-- Main pipeline arrow -->
  <rect x="50" y="150" width="1100" height="8" rx="4" fill="#00f0ff" fill-opacity="0.1"/>
  <rect x="50" y="150" width="275" height="8" rx="4" fill="#a060ff" fill-opacity="0.4"/>
  <rect x="325" y="150" width="275" height="8" fill="#00f0ff" fill-opacity="0.4"/>
  <rect x="600" y="150" width="275" height="8" fill="#f0c040" fill-opacity="0.4"/>
  <rect x="875" y="150" width="275" height="8" rx="4" fill="#40f080" fill-opacity="0.4"/>

  <!-- Phase 1: Narrative -->
  <rect x="50" y="180" width="260" height="460" rx="8" fill="#a060ff" fill-opacity="0.04" stroke="#a060ff" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="180" y="210" text-anchor="middle" fill="#a060ff" font-size="18" font-weight="bold" filter="url(#glow)">NARRATIVE</text>
  <text x="180" y="230" text-anchor="middle" fill="#a060ff" font-size="10" opacity="0.6">Phase 1 — Hours 0-5</text>
  
  <rect x="70" y="250" width="220" height="45" rx="3" fill="#a060ff" fill-opacity="0.06" stroke="#a060ff" stroke-opacity="0.2"/>
  <text x="180" y="270" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.6">Discover SOVcorp controls economy</text>
  <text x="180" y="285" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.4">Propaganda + restricted access</text>

  <rect x="70" y="305" width="220" height="45" rx="3" fill="#a060ff" fill-opacity="0.04" stroke="#a060ff" stroke-opacity="0.15"/>
  <text x="180" y="325" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.6">Encounter underground economy</text>
  <text x="180" y="340" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.4">First taste of GridScrip</text>

  <rect x="70" y="360" width="220" height="45" rx="3" fill="#a060ff" fill-opacity="0.06" stroke="#a060ff" stroke-opacity="0.2"/>
  <text x="180" y="380" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.6">Question "why two currencies?"</text>
  <text x="180" y="395" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.4">Curiosity, not ideology</text>

  <rect x="70" y="420" width="220" height="80" rx="3" fill="#a060ff" fill-opacity="0.08" stroke="#a060ff" stroke-opacity="0.3"/>
  <text x="180" y="445" text-anchor="middle" fill="#a060ff" font-size="10" font-weight="bold">PLAYER LEARNS:</text>
  <text x="180" y="463" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">• Surveillance economics exist</text>
  <text x="180" y="478" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">• Alternative systems are possible</text>
  <text x="180" y="493" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">• Privacy has economic value</text>

  <!-- Phase 2: Mechanical -->
  <rect x="330" y="180" width="260" height="460" rx="8" fill="#00f0ff" fill-opacity="0.04" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="460" y="210" text-anchor="middle" fill="#00f0ff" font-size="18" font-weight="bold" filter="url(#glow)">MECHANICAL</text>
  <text x="460" y="230" text-anchor="middle" fill="#00f0ff" font-size="10" opacity="0.6">Phase 2 — Hours 5-20</text>

  <rect x="350" y="250" width="220" height="45" rx="3" fill="#00f0ff" fill-opacity="0.06" stroke="#00f0ff" stroke-opacity="0.2"/>
