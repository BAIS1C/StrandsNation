  <rect x="630" y="305" width="220" height="45" rx="3" fill="#f0c040" fill-opacity="0.04" stroke="#f0c040" stroke-opacity="0.15"/>
  <text x="740" y="325" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.6">Optimise parcel revenue</text>
  <text x="740" y="340" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.4">A/B test content placement</text>

  <rect x="630" y="360" width="220" height="45" rx="3" fill="#f0c040" fill-opacity="0.06" stroke="#f0c040" stroke-opacity="0.2"/>
  <text x="740" y="380" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.6">Bridge GridScrip → $KREDS</text>
  <text x="740" y="395" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.4">Understand token economics</text>

  <rect x="630" y="420" width="220" height="80" rx="3" fill="#f0c040" fill-opacity="0.08" stroke="#f0c040" stroke-opacity="0.3"/>
  <text x="740" y="445" text-anchor="middle" fill="#f0c040" font-size="10" font-weight="bold">PLAYER LEARNS:</text>
  <text x="740" y="463" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">• DAO governance mechanics</text>
  <text x="740" y="478" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">• Revenue optimisation</text>
  <text x="740" y="493" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">• Real-world token bridging</text>

  <!-- Phase 4: Transfer -->
  <rect x="890" y="180" width="260" height="460" rx="8" fill="#40f080" fill-opacity="0.04" stroke="#40f080" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="1020" y="210" text-anchor="middle" fill="#40f080" font-size="18" font-weight="bold" filter="url(#glow)">TRANSFER</text>
  <text x="1020" y="230" text-anchor="middle" fill="#40f080" font-size="10" opacity="0.6">Phase 4 — Layer U Launch</text>

  <rect x="910" y="250" width="220" height="45" rx="3" fill="#40f080" fill-opacity="0.06" stroke="#40f080" stroke-opacity="0.2"/>
  <text x="1020" y="270" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.6">Buy real-world parcel DAO share</text>
  <text x="1020" y="285" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.4">Already knows the system</text>

  <rect x="910" y="305" width="220" height="45" rx="3" fill="#40f080" fill-opacity="0.04" stroke="#40f080" stroke-opacity="0.15"/>
  <text x="1020" y="325" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.6">Manage real AR content</text>
  <text x="1020" y="340" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.4">Same tools, real locations</text>

  <rect x="910" y="360" width="220" height="45" rx="3" fill="#40f080" fill-opacity="0.06" stroke="#40f080" stroke-opacity="0.2"/>
  <text x="1020" y="380" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.6">Earn real passive income</text>
  <text x="1020" y="395" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.4">$KREDS from real ad revenue</text>

  <rect x="910" y="420" width="220" height="80" rx="3" fill="#40f080" fill-opacity="0.08" stroke="#40f080" stroke-opacity="0.3"/>
  <text x="1020" y="445" text-anchor="middle" fill="#40f080" font-size="10" font-weight="bold">PLAYER ACHIEVES:</text>
  <text x="1020" y="463" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">• Real-world asset ownership</text>
  <text x="1020" y="478" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">• Passive income generation</text>
  <text x="1020" y="493" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">• UBI pathway contribution</text>

  <!-- Arrows between phases -->
  <line x1="310" y1="400" x2="330" y2="400" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowW)" opacity="0.4"/>
  <line x1="590" y1="400" x2="610" y2="400" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowW)" opacity="0.4"/>
  <line x1="870" y1="400" x2="890" y2="400" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowW)" opacity="0.4"/>

  <!-- Bottom insight -->
  <rect x="100" y="680" width="1000" height="70" rx="4" fill="#ffffff" fill-opacity="0.03" stroke="#40f080" stroke-opacity="0.3" stroke-width="1"/>
  <text x="600" y="702" text-anchor="middle" fill="#40f080" font-size="12" font-weight="bold">THE GAME IS THE ONBOARDING</text>
  <text x="600" y="722" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.6">By the time Layer U launches, thousands of players already understand XR real estate, DAO governance,</text>
  <text x="600" y="738" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.6">and attention economics. Zero learning curve. They've been practising for hundreds of hours.</text>
  <text x="1170" y="780" text-anchor="end" fill="#ffffff" font-size="10" opacity="0.3">Fig. 20</text>
</svg>
