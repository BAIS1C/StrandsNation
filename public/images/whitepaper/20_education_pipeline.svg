  <text x="460" y="285" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.4">Learn parcel management</text>

  <rect x="350" y="305" width="220" height="45" rx="3" fill="#00f0ff" fill-opacity="0.04" stroke="#00f0ff" stroke-opacity="0.15"/>
  <text x="460" y="325" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.6">Create holographic content</text>
  <text x="460" y="340" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.4">Skin the World™ tools</text>

  <rect x="350" y="360" width="220" height="45" rx="3" fill="#00f0ff" fill-opacity="0.06" stroke="#00f0ff" stroke-opacity="0.2"/>
  <text x="460" y="380" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.6">Observe NPC traffic → revenue</text>
  <text x="460" y="395" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.4">Cause and effect</text>

  <rect x="350" y="420" width="220" height="80" rx="3" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-opacity="0.3"/>
  <text x="460" y="445" text-anchor="middle" fill="#00f0ff" font-size="10" font-weight="bold">PLAYER LEARNS:</text>
  <text x="460" y="463" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">• How parcels generate revenue</text>
  <text x="460" y="478" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">• Content quality affects income</text>
  <text x="460" y="493" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">• Location value differs</text>

