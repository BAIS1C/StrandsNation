<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a0a14"/><stop offset="100%" stop-color="#06060c"/></linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#00f0ff" opacity="0.6"/></marker>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>

  <text x="600" y="42" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="2">WIFI DENSEPOSE TECHNICAL PIPELINE</text>
  <text x="600" y="64" text-anchor="middle" fill="#00f0ff" font-size="11" letter-spacing="4" opacity="0.7">CAMERA-FREE POSE ESTIMATION VIA CSI — CHAPTER 9</text>
  <line x1="300" y1="76" x2="900" y2="76" stroke="#00f0ff" stroke-width="0.5" opacity="0.3"/>

  <!-- Stage 1: Hardware -->
  <rect x="40" y="100" width="180" height="280" rx="4" fill="#ff6080" fill-opacity="0.04" stroke="#ff6080" stroke-width="0.8"/>
  <rect x="40" y="100" width="180" height="28" rx="4" fill="#ff6080" fill-opacity="0.12"/>
  <text x="130" y="118" text-anchor="middle" fill="#ff6080" font-size="11" font-weight="700">1. CSI CAPTURE</text>
  <text x="55" y="148" fill="#ffffff" font-size="9">ESP32-S3 hardware</text>
  <text x="55" y="166" fill="#ffffff" font-size="9">WiFi Channel State</text>
  <text x="55" y="184" fill="#ffffff" font-size="9">Information extraction</text>
  <text x="55" y="210" fill="#a0a8b8" font-size="8">52 subcarriers × N antennas</text>
  <text x="55" y="226" fill="#a0a8b8" font-size="8">Amplitude + phase data</text>
  <text x="55" y="242" fill="#a0a8b8" font-size="8">100-1000 packets/sec</text>
  <rect x="55" y="260" width="150" height="16" rx="8" fill="#ff6080" fill-opacity="0.1" stroke="#ff6080" stroke-width="0.3"/>
  <text x="130" y="272" text-anchor="middle" fill="#ff6080" font-size="8" font-weight="600">RAW CSI STREAM</text>
  
  <!-- Arrow 1→2 -->
  <line x1="222" y1="240" x2="268" y2="240" stroke="#00f0ff" stroke-width="1.5" opacity="0.4" marker-end="url(#arr)"/>

  <!-- Stage 2: Signal Processing -->
  <rect x="270" y="100" width="180" height="280" rx="4" fill="#f0c040" fill-opacity="0.04" stroke="#f0c040" stroke-width="0.8"/>
  <rect x="270" y="100" width="180" height="28" rx="4" fill="#f0c040" fill-opacity="0.12"/>
  <text x="360" y="118" text-anchor="middle" fill="#f0c040" font-size="11" font-weight="700">2. SIGNAL PROC</text>
  <text x="285" y="148" fill="#ffffff" font-size="9">Rust workspace</text>
  <text x="285" y="166" fill="#ffffff" font-size="9">(15 crates, 542+ tests)</text>
  <text x="285" y="192" fill="#a0a8b8" font-size="8">Noise filtering</text>
  <text x="285" y="208" fill="#a0a8b8" font-size="8">Phase sanitisation</text>
  <text x="285" y="224" fill="#a0a8b8" font-size="8">Doppler extraction</text>
  <text x="285" y="240" fill="#a0a8b8" font-size="8">Feature vector assembly</text>
  <rect x="285" y="260" width="150" height="16" rx="8" fill="#f0c040" fill-opacity="0.1" stroke="#f0c040" stroke-width="0.3"/>
  <text x="360" y="272" text-anchor="middle" fill="#f0c040" font-size="8" font-weight="600">CLEAN FEATURE VECTORS</text>

  <!-- Arrow 2→3 -->
  <line x1="452" y1="240" x2="498" y2="240" stroke="#00f0ff" stroke-width="1.5" opacity="0.4" marker-end="url(#arr)"/>

  <!-- Stage 3: Neural Inference -->
  <rect x="500" y="100" width="180" height="280" rx="4" fill="#00f0ff" fill-opacity="0.04" stroke="#00f0ff" stroke-width="0.8"/>
  <rect x="500" y="100" width="180" height="28" rx="4" fill="#00f0ff" fill-opacity="0.12"/>
  <text x="590" y="118" text-anchor="middle" fill="#00f0ff" font-size="11" font-weight="700">3. NEURAL INFER</text>
  <text x="515" y="148" fill="#ffffff" font-size="9">DensePose model</text>
  <text x="515" y="166" fill="#ffffff" font-size="9">(WASM build target)</text>
  <text x="515" y="192" fill="#a0a8b8" font-size="8">CSI → body mesh mapping</text>
  <text x="515" y="208" fill="#a0a8b8" font-size="8">24 UV body regions</text>
  <text x="515" y="224" fill="#a0a8b8" font-size="8">Joint position inference</text>
  <text x="515" y="240" fill="#a0a8b8" font-size="8">Confidence scoring</text>
  <rect x="515" y="260" width="150" height="16" rx="8" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-width="0.3"/>
  <text x="590" y="272" text-anchor="middle" fill="#00f0ff" font-size="8" font-weight="600">POSE SKELETON</text>

  <!-- Arrow 3→4 -->
  <line x1="682" y1="240" x2="728" y2="240" stroke="#00f0ff" stroke-width="1.5" opacity="0.4" marker-end="url(#arr)"/>

  <!-- Stage 4: Output -->
  <rect x="730" y="100" width="180" height="280" rx="4" fill="#40f080" fill-opacity="0.04" stroke="#40f080" stroke-width="0.8"/>
  <rect x="730" y="100" width="180" height="28" rx="4" fill="#40f080" fill-opacity="0.12"/>
  <text x="820" y="118" text-anchor="middle" fill="#40f080" font-size="11" font-weight="700">4. OUTPUT</text>
  <text x="745" y="148" fill="#ffffff" font-size="9">Game integration</text>
  <text x="745" y="166" fill="#ffffff" font-size="9">+ spatial sensing</text>
  <text x="745" y="192" fill="#a0a8b8" font-size="8">Avatar motion control</text>
  <text x="745" y="208" fill="#a0a8b8" font-size="8">Gesture recognition</text>
  <text x="745" y="224" fill="#a0a8b8" font-size="8">Presence detection</text>
  <text x="745" y="240" fill="#a0a8b8" font-size="8">Room occupancy data</text>
  <rect x="745" y="260" width="150" height="16" rx="8" fill="#40f080" fill-opacity="0.1" stroke="#40f080" stroke-width="0.3"/>
  <text x="820" y="272" text-anchor="middle" fill="#40f080" font-size="8" font-weight="600">GAME + LAYER U INPUT</text>

  <!-- Arrow 4→Applications -->
  <line x1="912" y1="240" x2="958" y2="240" stroke="#00f0ff" stroke-width="1.5" opacity="0.4" marker-end="url(#arr)"/>

  <!-- Applications column -->
  <rect x="960" y="100" width="200" height="280" rx="4" fill="#a060ff" fill-opacity="0.04" stroke="#a060ff" stroke-width="0.8"/>
  <rect x="960" y="100" width="200" height="28" rx="4" fill="#a060ff" fill-opacity="0.12"/>
  <text x="1060" y="118" text-anchor="middle" fill="#a060ff" font-size="11" font-weight="700">APPLICATIONS</text>
  <text x="975" y="150" fill="#ffffff" font-size="9">▸ Camera-free motion capture</text>
  <text x="975" y="168" fill="#ffffff" font-size="9">▸ AR avatar mirroring</text>
  <text x="975" y="186" fill="#ffffff" font-size="9">▸ Layer U foot traffic data</text>
  <text x="975" y="204" fill="#ffffff" font-size="9">▸ Smart home presence</text>
  <text x="975" y="222" fill="#ffffff" font-size="9">▸ Healthcare monitoring</text>
  <text x="975" y="240" fill="#ffffff" font-size="9">▸ Retail analytics</text>
  <text x="975" y="266" fill="#a060ff" font-size="8">Privacy: No camera = no image</text>
  <text x="975" y="282" fill="#a060ff" font-size="8">data. WiFi CSI only.</text>

  <!-- Performance stats bar -->
  <rect x="40" y="410" width="1120" height="80" rx="4" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-width="0.4"/>
  <text x="600" y="435" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">PERFORMANCE BENCHMARKS</text>
  
  <text x="140" y="465" text-anchor="middle" fill="#40f080" font-size="20" font-weight="700">810×</text>
  <text x="140" y="480" text-anchor="middle" fill="#a0a8b8" font-size="9">faster than Python</text>
  
  <text x="360" y="465" text-anchor="middle" fill="#00f0ff" font-size="20" font-weight="700">164</text>
  <text x="360" y="480" text-anchor="middle" fill="#a0a8b8" font-size="9">commits (Rust fork)</text>
  
  <text x="580" y="465" text-anchor="middle" fill="#f0c040" font-size="20" font-weight="700">15</text>
  <text x="580" y="480" text-anchor="middle" fill="#a0a8b8" font-size="9">Rust crates</text>
  
  <text x="800" y="465" text-anchor="middle" fill="#ff6080" font-size="20" font-weight="700">542+</text>
  <text x="800" y="480" text-anchor="middle" fill="#a0a8b8" font-size="9">test cases</text>
  
  <text x="1020" y="465" text-anchor="middle" fill="#a060ff" font-size="20" font-weight="700">WASM</text>
  <text x="1020" y="480" text-anchor="middle" fill="#a0a8b8" font-size="9">build target (browser)</text>

  <!-- Privacy callout -->
  <rect x="40" y="510" width="1120" height="50" rx="4" fill="#40f080" fill-opacity="0.03" stroke="#40f080" stroke-width="0.4"/>
  <text x="600" y="535" text-anchor="middle" fill="#40f080" font-size="12" font-weight="700">PRIVACY ADVANTAGE: WiFi CSI sensing captures pose without capturing images</text>
  <text x="600" y="552" text-anchor="middle" fill="#a0a8b8" font-size="10">No camera data = no faces = no GDPR image consent required. Works through walls. Works in the dark.</text>

  <text x="1170" y="590" text-anchor="end" fill="#ffffff" font-size="9" opacity="0.2">Fig. 40</text>
</svg>