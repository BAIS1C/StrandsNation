<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a0a14"/><stop offset="100%" stop-color="#06060c"/></linearGradient>
  </defs>
  <rect width="1100" height="650" fill="url(#bg)"/>

  <text x="550" y="42" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="2">THE EXCHANGE — DUAL-CONTEXT MARKETPLACE</text>
  <text x="550" y="64" text-anchor="middle" fill="#00f0ff" font-size="11" letter-spacing="4" opacity="0.7">IN-GAME ECONOMY + REAL-WORLD PARALLEL — CHAPTER 11</text>
  <line x1="280" y1="76" x2="820" y2="76" stroke="#00f0ff" stroke-width="0.5" opacity="0.3"/>

  <!-- IN-GAME (Left) -->
  <rect x="60" y="100" width="460" height="400" rx="6" fill="#00f0ff" fill-opacity="0.03" stroke="#00f0ff" stroke-width="0.8"/>
  <rect x="60" y="100" width="460" height="40" rx="6" fill="#00f0ff" fill-opacity="0.1"/>
  <text x="290" y="126" text-anchor="middle" fill="#00f0ff" font-size="15" font-weight="700">IN-GAME EXCHANGE</text>

  <text x="80" y="165" fill="#ffffff" font-size="11" font-weight="600">What's Traded:</text>
  <text x="80" y="188" fill="#ffffff" font-size="10">▸ Player-crafted items (weapons, armour, tools)</text>
  <text x="80" y="206" fill="#ffffff" font-size="10">▸ Skin the World™ generated assets</text>
  <text x="80" y="224" fill="#ffffff" font-size="10">▸ Music compositions (Ace Studio)</text>
  <text x="80" y="242" fill="#ffffff" font-size="10">▸ Harvested resources &amp; materials</text>
  <text x="80" y="260" fill="#ffffff" font-size="10">▸ Housing blueprints &amp; decorations</text>

  <line x1="90" y1="278" x2="500" y2="278" stroke="#00f0ff" stroke-width="0.2" opacity="0.3"/>
  <text x="80" y="301" fill="#ffffff" font-size="11" font-weight="600">Currency:</text>
  <text x="80" y="321" fill="#ffffff" font-size="10">▸ UBC (Energy) — primary</text>
  <text x="80" y="339" fill="#ffffff" font-size="10">▸ UBComp (Process Power) — for gen assets</text>

  <line x1="90" y1="355" x2="500" y2="355" stroke="#00f0ff" stroke-width="0.2" opacity="0.3"/>
  <text x="80" y="378" fill="#ffffff" font-size="11" font-weight="600">Commission:</text>
  <text x="80" y="398" fill="#ffffff" font-size="10">▸ 2–5% platform fee per transaction</text>
  <text x="80" y="416" fill="#ffffff" font-size="10">▸ Seller keeps 95–98%</text>

  <line x1="90" y1="432" x2="500" y2="432" stroke="#00f0ff" stroke-width="0.2" opacity="0.3"/>
  <text x="80" y="455" fill="#ffffff" font-size="11" font-weight="600">Lore Context:</text>
  <text x="80" y="475" fill="#a0a8b8" font-size="10">The SOVcorp-sanctioned public bazaar.</text>
  <text x="80" y="491" fill="#a0a8b8" font-size="10">Everything traded here is "approved."</text>

  <!-- LAYER U (Right) -->
  <rect x="580" y="100" width="460" height="400" rx="6" fill="#f0c040" fill-opacity="0.03" stroke="#f0c040" stroke-width="0.8"/>
  <rect x="580" y="100" width="460" height="40" rx="6" fill="#f0c040" fill-opacity="0.1"/>
  <text x="810" y="126" text-anchor="middle" fill="#f0c040" font-size="15" font-weight="700">LAYER U EXCHANGE</text>

  <text x="600" y="165" fill="#ffffff" font-size="11" font-weight="600">What's Traded:</text>
  <text x="600" y="188" fill="#ffffff" font-size="10">▸ XR ad space parcels (10m³ volumetric)</text>
  <text x="600" y="206" fill="#ffffff" font-size="10">▸ DAO membership positions</text>
  <text x="600" y="224" fill="#ffffff" font-size="10">▸ Real-world service access tokens</text>
  <text x="600" y="242" fill="#ffffff" font-size="10">▸ B2B data licensing contracts</text>
  <text x="600" y="260" fill="#ffffff" font-size="10">▸ Creator economy commissions</text>

  <line x1="610" y1="278" x2="1020" y2="278" stroke="#f0c040" stroke-width="0.2" opacity="0.3"/>
  <text x="600" y="301" fill="#ffffff" font-size="11" font-weight="600">Currency:</text>
  <text x="600" y="321" fill="#ffffff" font-size="10">▸ Fiat (USD/MYR) — primary</text>
  <text x="600" y="339" fill="#ffffff" font-size="10">▸ $KREDS — secondary (post-chain launch)</text>

  <line x1="610" y1="355" x2="1020" y2="355" stroke="#f0c040" stroke-width="0.2" opacity="0.3"/>
  <text x="600" y="378" fill="#ffffff" font-size="11" font-weight="600">Commission:</text>
  <text x="600" y="398" fill="#ffffff" font-size="10">▸ 2–5% platform fee per transaction</text>
  <text x="600" y="416" fill="#ffffff" font-size="10">▸ 20% of DAO revenue → $KREDS buy</text>

  <line x1="610" y1="432" x2="1020" y2="432" stroke="#f0c040" stroke-width="0.2" opacity="0.3"/>
  <text x="600" y="455" fill="#ffffff" font-size="11" font-weight="600">Lore Context:</text>
  <text x="600" y="475" fill="#a0a8b8" font-size="10">The underground market that connects</text>
  <text x="600" y="491" fill="#a0a8b8" font-size="10">MetaXity1 to the "outside" real world.</text>

  <!-- Bridge connection -->
  <rect x="520" y="240" width="60" height="100" rx="4" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-width="0.5" opacity="0.4"/>
  <text x="550" y="275" text-anchor="middle" fill="#ffffff" font-size="20" opacity="0.4">⟷</text>
  <text x="550" y="310" text-anchor="middle" fill="#a0a8b8" font-size="8">Skills</text>
  <text x="550" y="322" text-anchor="middle" fill="#a0a8b8" font-size="8">transfer</text>

  <!-- Bottom insight -->
  <rect x="60" y="530" width="980" height="80" rx="4" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-width="0.4"/>
  <text x="550" y="555" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">SAME SKILLS, TWO ECONOMIES</text>
  <text x="550" y="578" text-anchor="middle" fill="#a0a8b8" font-size="10">A player who masters crafting in-game has real skills for Layer U commerce.</text>
  <text x="550" y="596" text-anchor="middle" fill="#a0a8b8" font-size="10">The game trains the workforce. Layer U employs them. This is not a metaphor — it's the architecture.</text>

  <text x="1070" y="640" text-anchor="end" fill="#ffffff" font-size="9" opacity="0.2">Fig. 10</text>
</svg>