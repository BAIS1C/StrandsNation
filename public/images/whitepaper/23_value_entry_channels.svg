  <rect x="50" y="140" width="350" height="80" rx="6" fill="#f0c040" fill-opacity="0.08" stroke="#f0c040" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="70" y="168" fill="#f0c040" font-size="14" font-weight="bold">① A.R.E. GAME REVENUE</text>
  <text x="70" y="188" fill="#ffffff" font-size="10" opacity="0.5">In-game attention ads · 60/40 split · eCPM $2-7</text>
  <text x="70" y="206" fill="#f0c040" font-size="10" font-weight="bold">Est. $2M/mo at 1M DAU</text>

