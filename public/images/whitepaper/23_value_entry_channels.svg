  <text x="70" y="306" fill="#00f0ff" font-size="10" font-weight="bold">Est. $33K/mo at KL pilot scale</text>

  <!-- Channel 3 -->
  <rect x="50" y="340" width="350" height="80" rx="6" fill="#40f080" fill-opacity="0.08" stroke="#40f080" stroke-opacity="0.4" stroke-width="1.5"/>
