  <text x="1010" y="440" text-anchor="middle" fill="#00f0ff" font-size="10">Incentivises network growth</text>

  <rect x="870" y="500" width="280" height="100" rx="6" fill="#a060ff" fill-opacity="0.06" stroke="#a060ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="1010" y="530" text-anchor="middle" fill="#a060ff" font-size="13" font-weight="bold">UBI REDISTRIBUTION</text>
  <text x="1010" y="552" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.5">Revenue → buy → distribute</text>
  <text x="1010" y="570" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.5">to all network participants</text>
  <text x="1010" y="590" text-anchor="middle" fill="#a060ff" font-size="10">The endgame: equitable income</text>

  <!-- Bottom -->
  <rect x="100" y="700" width="1000" height="55" rx="4" fill="#ffffff" fill-opacity="0.03" stroke="#f0c040" stroke-opacity="0.3" stroke-width="1"/>
  <text x="600" y="722" text-anchor="middle" fill="#f0c040" font-size="12" font-weight="bold">EVERY CHANNEL IS FIAT-DENOMINATED REVENUE FROM REAL ECONOMIC ACTIVITY</text>
  <text x="600" y="742" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.6">No ICO. No IDO. No token pre-sale. $KREDS only gains value when the ecosystem generates real revenue.</text>
  <text x="1170" y="780" text-anchor="end" fill="#ffffff" font-size="10" opacity="0.3">Fig. 23</text>
</svg>
