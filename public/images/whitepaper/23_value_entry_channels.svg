  <line x1="400" y1="280" x2="550" y2="390" stroke="#f0c040" stroke-width="1.5" marker-end="url(#arrowG)" opacity="0.4"/>
  <line x1="400" y1="380" x2="550" y2="395" stroke="#f0c040" stroke-width="1.5" marker-end="url(#arrowG)" opacity="0.4"/>
  <line x1="400" y1="480" x2="550" y2="400" stroke="#f0c040" stroke-width="1.5" marker-end="url(#arrowG)" opacity="0.4"/>
  <line x1="400" y1="580" x2="550" y2="410" stroke="#f0c040" stroke-width="1.5" marker-end="url(#arrowG)" opacity="0.4"/>

