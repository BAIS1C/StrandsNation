  <text x="70" y="388" fill="#ffffff" font-size="10" opacity="0.5">5% commission on all player-to-player trades</text>
  <text x="70" y="406" fill="#40f080" font-size="10" font-weight="bold">Scales with economy volume</text>

  <!-- Channel 4 -->
  <rect x="50" y="440" width="350" height="80" rx="6" fill="#a060ff" fill-opacity="0.08" stroke="#a060ff" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="70" y="468" fill="#a060ff" font-size="14" font-weight="bold">④ FOUNDERS PASS + DLC</text>
  <text x="70" y="488" fill="#ffffff" font-size="10" opacity="0.5">6,000 passes · Sublime upgrades · Future content</text>
  <text x="70" y="506" fill="#a060ff" font-size="10" font-weight="bold">$277K-$427K initial + recurring</text>

