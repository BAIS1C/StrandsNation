  <line x1="800" y1="400" x2="870" y2="400" stroke="#f0c040" stroke-width="1.5" marker-end="url(#arrowG)" opacity="0.4"/>
  <line x1="800" y1="430" x2="870" y2="550" stroke="#f0c040" stroke-width="1.5" marker-end="url(#arrowG)" opacity="0.4"/>

