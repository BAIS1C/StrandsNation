<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a0a14"/><stop offset="100%" stop-color="#06060c"/></linearGradient>
    <marker id="arrD" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#f0c040" opacity="0.5"/></marker>
  </defs>
  <rect width="1100" height="700" fill="url(#bg)"/>

  <text x="550" y="42" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="2">DAO + LTD HYBRID GOVERNANCE</text>
  <text x="550" y="64" text-anchor="middle" fill="#f0c040" font-size="11" letter-spacing="4" opacity="0.7">DECENTRALISED DECISION-MAKING + LEGAL COMPLIANCE — CHAPTER 12</text>
  <line x1="280" y1="76" x2="820" y2="76" stroke="#f0c040" stroke-width="0.5" opacity="0.3"/>

  <!-- DAO Side (Left) -->
  <rect x="60" y="110" width="460" height="380" rx="6" fill="#f0c040" fill-opacity="0.03" stroke="#f0c040" stroke-width="0.8"/>
  <rect x="60" y="110" width="460" height="36" rx="6" fill="#f0c040" fill-opacity="0.1"/>
  <text x="290" y="133" text-anchor="middle" fill="#f0c040" font-size="15" font-weight="700">DAO (ON-CHAIN GOVERNANCE)</text>

  <text x="80" y="170" fill="#ffffff" font-size="11" font-weight="600">Who votes:</text>
  <text x="80" y="192" fill="#ffffff" font-size="10">▸ DAO members (purchased via Layer U parcels)</text>
  <text x="80" y="210" fill="#ffffff" font-size="10">▸ Founders Pass holders (founding votes)</text>
  <text x="80" y="228" fill="#ffffff" font-size="10">▸ $KREDS stakers (weighted by stake)</text>

  <line x1="90" y1="246" x2="500" y2="246" stroke="#f0c040" stroke-width="0.2" opacity="0.3"/>
  <text x="80" y="270" fill="#ffffff" font-size="11" font-weight="600">What DAO decides:</text>
  <text x="80" y="292" fill="#ffffff" font-size="10">▸ Revenue allocation priorities</text>
  <text x="80" y="310" fill="#ffffff" font-size="10">▸ New parcel zone approval</text>
  <text x="80" y="328" fill="#ffffff" font-size="10">▸ Advertiser policy / content standards</text>
  <text x="80" y="346" fill="#ffffff" font-size="10">▸ Infrastructure investment proposals</text>
  <text x="80" y="364" fill="#ffffff" font-size="10">▸ Community fund disbursement</text>

  <line x1="90" y1="382" x2="500" y2="382" stroke="#f0c040" stroke-width="0.2" opacity="0.3"/>
  <text x="80" y="405" fill="#ffffff" font-size="11" font-weight="600">Mechanism:</text>
  <text x="80" y="425" fill="#ffffff" font-size="10">▸ Quadratic voting (prevents whale dominance)</text>
  <text x="80" y="443" fill="#ffffff" font-size="10">▸ Proposal threshold: 5% of members</text>
  <text x="80" y="461" fill="#ffffff" font-size="10">▸ 72-hour voting window</text>
  <text x="80" y="479" fill="#a0a8b8" font-size="9">On-chain execution via Strands Chain smart contracts</text>

  <!-- Ltd Side (Right) -->
  <rect x="580" y="110" width="460" height="380" rx="6" fill="#00f0ff" fill-opacity="0.03" stroke="#00f0ff" stroke-width="0.8"/>
  <rect x="580" y="110" width="460" height="36" rx="6" fill="#00f0ff" fill-opacity="0.1"/>
  <text x="810" y="133" text-anchor="middle" fill="#00f0ff" font-size="15" font-weight="700">LTD (LEGAL ENTITY)</text>

  <text x="600" y="170" fill="#ffffff" font-size="11" font-weight="600">Who operates:</text>
  <text x="600" y="192" fill="#ffffff" font-size="10">▸ Appointed directors (DAO-elected)</text>
  <text x="600" y="210" fill="#ffffff" font-size="10">▸ Local legal counsel</text>
  <text x="600" y="228" fill="#ffffff" font-size="10">▸ Compliance officers</text>

  <line x1="610" y1="246" x2="1020" y2="246" stroke="#00f0ff" stroke-width="0.2" opacity="0.3"/>
  <text x="600" y="270" fill="#ffffff" font-size="11" font-weight="600">What Ltd handles:</text>
  <text x="600" y="292" fill="#ffffff" font-size="10">▸ Bank accounts &amp; fiat treasury</text>
  <text x="600" y="310" fill="#ffffff" font-size="10">▸ Advertiser contracts (legally binding)</text>
  <text x="600" y="328" fill="#ffffff" font-size="10">▸ Tax compliance per jurisdiction</text>
  <text x="600" y="346" fill="#ffffff" font-size="10">▸ IP protection &amp; licensing</text>
  <text x="600" y="364" fill="#ffffff" font-size="10">▸ Employment / contractor agreements</text>

  <line x1="610" y1="382" x2="1020" y2="382" stroke="#00f0ff" stroke-width="0.2" opacity="0.3"/>
  <text x="600" y="405" fill="#ffffff" font-size="11" font-weight="600">Constraint:</text>
  <text x="600" y="425" fill="#ffffff" font-size="10">▸ Ltd MUST execute DAO decisions</text>
  <text x="600" y="443" fill="#ffffff" font-size="10">▸ Cannot override community vote</text>
  <text x="600" y="461" fill="#ffffff" font-size="10">▸ Directors serve at DAO's pleasure</text>
  <text x="600" y="479" fill="#a0a8b8" font-size="9">Legal wrapper for DAO — not a separate power centre</text>

  <!-- Bridge between DAO and Ltd -->
  <rect x="480" y="240" width="140" height="80" rx="4" fill="#40f080" fill-opacity="0.06" stroke="#40f080" stroke-width="0.8"/>
  <text x="550" y="268" text-anchor="middle" fill="#40f080" font-size="11" font-weight="700">BRIDGE</text>
  <text x="550" y="288" text-anchor="middle" fill="#a0a8b8" font-size="8">DAO decides</text>
  <text x="550" y="300" text-anchor="middle" fill="#a0a8b8" font-size="8">Ltd executes</text>

  <!-- Why hybrid -->
  <rect x="60" y="520" width="980" height="130" rx="4" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-width="0.4"/>
  <text x="550" y="548" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">WHY HYBRID — NOT PURE DAO</text>
  <text x="80" y="575" fill="#a0a8b8" font-size="10">▸ Pure DAOs can't sign contracts, open bank accounts, or sue for IP violation in most jurisdictions</text>
  <text x="80" y="595" fill="#a0a8b8" font-size="10">▸ Pure Ltd companies concentrate power in directors — no community governance</text>
  <text x="80" y="615" fill="#a0a8b8" font-size="10">▸ Hybrid model: democratic decision-making (DAO) + legal enforceability (Ltd) = best of both worlds</text>
  <text x="80" y="635" fill="#40f080" font-size="10" font-weight="600">Each city-level Layer U DAO has its own Ltd entity. KL pilot first, then replicate per city.</text>

  <text x="1070" y="690" text-anchor="end" fill="#ffffff" font-size="9" opacity="0.2">Fig. 15</text>
</svg>