<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a0a14"/><stop offset="100%" stop-color="#06060c"/></linearGradient>
  </defs>
  <rect width="900" height="700" fill="url(#bg)"/>

  <text x="450" y="42" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="2">VOLUMETRIC PARCEL STRUCTURE</text>
  <text x="450" y="64" text-anchor="middle" fill="#f0c040" font-size="11" letter-spacing="4" opacity="0.7">10m³ XR AD SPACE — LAYER U ASSET — CHAPTER 12</text>
  <line x1="200" y1="76" x2="700" y2="76" stroke="#f0c040" stroke-width="0.5" opacity="0.3"/>

  <!-- Isometric cube -->
  <g transform="translate(300, 260)">
    <!-- Top face -->
    <polygon points="0,-80 160,-160 320,-80 160,0" fill="#f0c040" fill-opacity="0.12" stroke="#f0c040" stroke-width="1"/>
    <!-- Left face -->
    <polygon points="0,-80 160,0 160,200 0,120" fill="#f0c040" fill-opacity="0.06" stroke="#f0c040" stroke-width="1"/>
    <!-- Right face -->
    <polygon points="320,-80 160,0 160,200 320,120" fill="#f0c040" fill-opacity="0.03" stroke="#f0c040" stroke-width="1"/>

    <!-- Grid lines on top face -->
    <line x1="53" y1="-107" x2="213" y2="-27" stroke="#f0c040" stroke-width="0.3" opacity="0.2"/>
    <line x1="107" y1="-133" x2="267" y2="-53" stroke="#f0c040" stroke-width="0.3" opacity="0.2"/>
    <line x1="53" y1="-27" x2="213" y2="-107" stroke="#f0c040" stroke-width="0.3" opacity="0.2"/>
    <line x1="107" y1="-53" x2="267" y2="-133" stroke="#f0c040" stroke-width="0.3" opacity="0.2"/>

    <!-- Dimension labels -->
    <text x="-30" y="20" fill="#ffffff" font-size="12" font-weight="600">10m</text>
    <text x="340" y="20" fill="#ffffff" font-size="12" font-weight="600">10m</text>
    <text x="175" y="-170" fill="#ffffff" font-size="12" font-weight="600">10m</text>

    <!-- Volume label in centre -->
    <text x="160" y="-40" text-anchor="middle" fill="#f0c040" font-size="18" font-weight="700">10m³</text>
    <text x="160" y="-20" text-anchor="middle" fill="#a0a8b8" font-size="10">VOLUMETRIC PARCEL</text>

    <!-- XR content indicators -->
    <rect x="50" y="30" width="80" height="50" rx="3" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-width="0.5" transform="skewY(-26)"/>
    <text x="70" y="60" fill="#00f0ff" font-size="8" transform="skewY(-26)">AD SLOT A</text>

    <rect x="190" y="-30" width="80" height="50" rx="3" fill="#40f080" fill-opacity="0.08" stroke="#40f080" stroke-width="0.5" transform="skewY(26)"/>
    <text x="210" y="0" fill="#40f080" font-size="8" transform="skewY(26)">AD SLOT B</text>
  </g>

  <!-- Right panel: Parcel details -->
  <rect x="560" y="100" width="300" height="450" rx="4" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-width="0.4"/>
  
  <text x="710" y="130" text-anchor="middle" fill="#f0c040" font-size="14" font-weight="700">PARCEL SPECIFICATION</text>
  <line x1="580" y1="142" x2="840" y2="142" stroke="#f0c040" stroke-width="0.3" opacity="0.3"/>

  <text x="580" y="168" fill="#a0a8b8" font-size="9" font-weight="600">DIMENSIONS</text>
  <text x="580" y="188" fill="#ffffff" font-size="10">10m × 10m × 10m = 1,000m³ usable</text>
  <text x="580" y="206" fill="#ffffff" font-size="10">GPS-anchored to real-world location</text>

  <line x1="580" y1="222" x2="840" y2="222" stroke="#ffffff" stroke-width="0.2" opacity="0.1"/>
  <text x="580" y="245" fill="#a0a8b8" font-size="9" font-weight="600">CONTENT TYPES</text>
  <text x="580" y="265" fill="#ffffff" font-size="10">▸ 3D holographic ads</text>
  <text x="580" y="283" fill="#ffffff" font-size="10">▸ Interactive AR experiences</text>
  <text x="580" y="301" fill="#ffffff" font-size="10">▸ Storefront displays</text>
  <text x="580" y="319" fill="#ffffff" font-size="10">▸ Event spaces</text>
  <text x="580" y="337" fill="#ffffff" font-size="10">▸ Community message boards</text>

  <line x1="580" y1="353" x2="840" y2="353" stroke="#ffffff" stroke-width="0.2" opacity="0.1"/>
  <text x="580" y="376" fill="#a0a8b8" font-size="9" font-weight="600">OWNERSHIP MODEL</text>
  <text x="580" y="396" fill="#ffffff" font-size="10">▸ DAO-owned (city-level)</text>
  <text x="580" y="414" fill="#ffffff" font-size="10">▸ Licensed to advertisers (per m³/yr)</text>
  <text x="580" y="432" fill="#ffffff" font-size="10">▸ Revenue → 60% members / 20% infra</text>
  <text x="580" y="450" fill="#ffffff" font-size="10">▸ 20% → $KREDS market buy</text>

  <line x1="580" y1="466" x2="840" y2="466" stroke="#ffffff" stroke-width="0.2" opacity="0.1"/>
  <text x="580" y="489" fill="#a0a8b8" font-size="9" font-weight="600">PRICING (KL PILOT)</text>
  <text x="580" y="509" fill="#ffffff" font-size="10">Year 1: $50/m³/yr (subsidised)</text>
  <text x="580" y="527" fill="#ffffff" font-size="10">Year 3: $150/m³/yr (market rate)</text>
  <text x="580" y="545" fill="#a0a8b8" font-size="9">Per parcel: $500–$1,500/yr</text>

  <!-- Bottom callout -->
  <rect x="60" y="580" width="800" height="70" rx="4" fill="#f0c040" fill-opacity="0.03" stroke="#f0c040" stroke-width="0.4"/>
  <text x="460" y="605" text-anchor="middle" fill="#f0c040" font-size="12" font-weight="700">REAL-WORLD XR REAL ESTATE — NOT A GAME ASSET</text>
  <text x="460" y="625" text-anchor="middle" fill="#a0a8b8" font-size="10">Each parcel is GPS-anchored to a physical location. Advertisers buy the right to place XR content</text>
  <text x="460" y="641" text-anchor="middle" fill="#a0a8b8" font-size="10">visible to anyone running EveryWear browser within range. This is the core Layer U business model.</text>

  <text x="870" y="690" text-anchor="end" fill="#ffffff" font-size="9" opacity="0.2">Fig. 13</text>
</svg>