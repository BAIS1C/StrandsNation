<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a0a14"/><stop offset="100%" stop-color="#06060c"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#f0c040" stroke-width="1"/></marker>
    <marker id="arrowUp" markerWidth="6" markerHeight="8" refX="3" refY="0" orient="auto"><path d="M0,8 L3,0 L6,8" fill="none" stroke="#40f080" stroke-width="1"/></marker>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#00f0ff"><line x1="0" y1="400" x2="1200" y2="400" stroke-dasharray="2,8"/></g>
  <text x="600" y="42" text-anchor="middle" fill="#00f0ff" font-size="11" letter-spacing="4" opacity="0.6">CHAPTER 12 — LAYER U</text>
  <text x="600" y="72" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold" letter-spacing="1">GAME-TO-REALITY DATA VALIDATION PIPELINE</text>
  <text x="600" y="96" text-anchor="middle" fill="#ffffff" font-size="13" opacity="0.5">In-game predictions vs real-world measurements — continuous feedback loop</text>

  <!-- Top row: Game World -->
  <rect x="50" y="130" width="1100" height="200" rx="8" fill="#a060ff" fill-opacity="0.03" stroke="#a060ff" stroke-opacity="0.2" stroke-width="1"/>
  <text x="600" y="155" text-anchor="middle" fill="#a060ff" font-size="14" font-weight="bold" letter-spacing="2">GAME WORLD (MetaXity1)</text>
  
  <rect x="80" y="170" width="200" height="80" rx="4" fill="#a060ff" fill-opacity="0.08" stroke="#a060ff" stroke-opacity="0.3"/>
  <text x="180" y="200" text-anchor="middle" fill="#a060ff" font-size="11" font-weight="bold">NPC TRAFFIC SIM</text>
  <text x="180" y="218" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">AI-driven foot traffic</text>
  <text x="180" y="233" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">patterns in sectors</text>

  <rect x="310" y="170" width="200" height="80" rx="4" fill="#a060ff" fill-opacity="0.08" stroke="#a060ff" stroke-opacity="0.3"/>
  <text x="410" y="200" text-anchor="middle" fill="#a060ff" font-size="11" font-weight="bold">PLAYER BEHAVIOUR</text>
  <text x="410" y="218" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">Where players go,</text>
  <text x="410" y="233" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">what they buy, dwell</text>

  <rect x="540" y="170" width="200" height="80" rx="4" fill="#a060ff" fill-opacity="0.08" stroke="#a060ff" stroke-opacity="0.3"/>
  <text x="640" y="200" text-anchor="middle" fill="#a060ff" font-size="11" font-weight="bold">AD PERFORMANCE</text>
  <text x="640" y="218" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">Which ads get attention,</text>
  <text x="640" y="233" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">click-through, revenue</text>

  <rect x="770" y="170" width="200" height="80" rx="4" fill="#a060ff" fill-opacity="0.08" stroke="#a060ff" stroke-opacity="0.3"/>
  <text x="870" y="200" text-anchor="middle" fill="#a060ff" font-size="11" font-weight="bold">PREDICTION MODEL</text>
  <text x="870" y="218" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">Game data generates</text>
  <text x="870" y="233" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">real-world predictions</text>

  <rect x="1000" y="170" width="130" height="80" rx="4" fill="#f0c040" fill-opacity="0.1" stroke="#f0c040" stroke-opacity="0.4"/>
  <text x="1065" y="200" text-anchor="middle" fill="#f0c040" font-size="11" font-weight="bold">OUTPUT</text>
  <text x="1065" y="218" text-anchor="middle" fill="#f0c040" font-size="9">Predicted eCPM,</text>
  <text x="1065" y="233" text-anchor="middle" fill="#f0c040" font-size="9">traffic, revenue</text>

  <!-- Arrows between game stages -->
  <line x1="280" y1="210" x2="310" y2="210" stroke="#a060ff" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="510" y1="210" x2="540" y2="210" stroke="#a060ff" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="740" y1="210" x2="770" y2="210" stroke="#a060ff" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="970" y1="210" x2="1000" y2="210" stroke="#a060ff" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Middle: Comparison Engine -->
  <rect x="350" y="370" width="500" height="80" rx="8" fill="#f0c040" fill-opacity="0.08" stroke="#f0c040" stroke-opacity="0.5" stroke-width="2"/>
  <text x="600" y="400" text-anchor="middle" fill="#f0c040" font-size="16" font-weight="bold" filter="url(#glow)">⟷ COMPARISON ENGINE</text>
  <text x="600" y="422" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.5">Game predictions vs real-world measurements — calculates accuracy score</text>
  <text x="600" y="440" text-anchor="middle" fill="#f0c040" font-size="10" opacity="0.7">Higher accuracy = more reliable pricing for advertisers = higher eCPM</text>

  <!-- Arrows down from game and up from reality -->
  <line x1="600" y1="330" x2="600" y2="370" stroke="#f0c040" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="620" y="355" fill="#a060ff" font-size="9" opacity="0.7">PREDICTIONS ↓</text>
  
  <line x1="600" y1="500" x2="600" y2="460" stroke="#40f080" stroke-width="2" marker-end="url(#arrowUp)"/>
  <text x="620" y="490" fill="#40f080" font-size="9" opacity="0.7">MEASUREMENTS ↑</text>

  <!-- Bottom row: Real World -->
  <rect x="50" y="500" width="1100" height="200" rx="8" fill="#40f080" fill-opacity="0.03" stroke="#40f080" stroke-opacity="0.2" stroke-width="1"/>
  <text x="600" y="525" text-anchor="middle" fill="#40f080" font-size="14" font-weight="bold" letter-spacing="2">REAL WORLD (Layer U Deployment)</text>

  <rect x="80" y="540" width="200" height="80" rx="4" fill="#40f080" fill-opacity="0.08" stroke="#40f080" stroke-opacity="0.3"/>
  <text x="180" y="570" text-anchor="middle" fill="#40f080" font-size="11" font-weight="bold">WiFi DENSEPOSE</text>
  <text x="180" y="588" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">Real pedestrian count</text>
  <text x="180" y="603" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">and flow patterns</text>

  <rect x="310" y="540" width="200" height="80" rx="4" fill="#40f080" fill-opacity="0.08" stroke="#40f080" stroke-opacity="0.3"/>
  <text x="410" y="570" text-anchor="middle" fill="#40f080" font-size="11" font-weight="bold">AR ENGAGEMENT</text>
  <text x="410" y="588" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">Real user interaction</text>
  <text x="410" y="603" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">with parcel content</text>

  <rect x="540" y="540" width="200" height="80" rx="4" fill="#40f080" fill-opacity="0.08" stroke="#40f080" stroke-opacity="0.3"/>
  <text x="640" y="570" text-anchor="middle" fill="#40f080" font-size="11" font-weight="bold">REAL AD REVENUE</text>
  <text x="640" y="588" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">Actual A.R.E. earnings</text>
  <text x="640" y="603" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">per parcel per day</text>

  <rect x="770" y="540" width="200" height="80" rx="4" fill="#40f080" fill-opacity="0.08" stroke="#40f080" stroke-opacity="0.3"/>
  <text x="870" y="570" text-anchor="middle" fill="#40f080" font-size="11" font-weight="bold">ACCURACY SCORE</text>
  <text x="870" y="588" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">How well game predicted</text>
  <text x="870" y="603" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">actual performance</text>

  <rect x="1000" y="540" width="130" height="80" rx="4" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-opacity="0.4"/>
  <text x="1065" y="570" text-anchor="middle" fill="#00f0ff" font-size="11" font-weight="bold">FEEDBACK</text>
  <text x="1065" y="588" text-anchor="middle" fill="#00f0ff" font-size="9">Improves game</text>
  <text x="1065" y="603" text-anchor="middle" fill="#00f0ff" font-size="9">simulation model</text>

  <!-- Feedback loop arrow back up -->
  <path d="M 1065 540 L 1065 300 L 870 250" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="6,4" stroke-opacity="0.4"/>
  <text x="1090" y="400" fill="#00f0ff" font-size="9" opacity="0.5" transform="rotate(90, 1090, 400)">FEEDBACK LOOP</text>

  <!-- Bottom insight -->
  <rect x="100" y="730" width="1000" height="40" rx="4" fill="#ffffff" fill-opacity="0.03" stroke="#40f080" stroke-opacity="0.3" stroke-width="1"/>
  <text x="600" y="755" text-anchor="middle" fill="#40f080" font-size="12" font-weight="bold">THE GAME TRAINS THE MODEL: Better game simulation → better real-world predictions → higher advertiser confidence → higher eCPM</text>
  <text x="1170" y="780" text-anchor="end" fill="#ffffff" font-size="10" opacity="0.3">Fig. 19</text>
</svg>
