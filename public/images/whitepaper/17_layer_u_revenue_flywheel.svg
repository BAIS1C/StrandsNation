<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a0a14"/><stop offset="100%" stop-color="#06060c"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrowC" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#00f0ff" stroke-width="1"/></marker>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#00f0ff"><line x1="0" y1="400" x2="1200" y2="400" stroke-dasharray="2,8"/></g>
  <text x="600" y="42" text-anchor="middle" fill="#00f0ff" font-size="11" letter-spacing="4" opacity="0.6">CHAPTER 12 — LAYER U</text>
  <text x="600" y="72" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold" letter-spacing="1">LAYER U REVENUE FLYWHEEL</text>
  <text x="600" y="96" text-anchor="middle" fill="#ffffff" font-size="13" opacity="0.5">Eight-stage self-reinforcing cycle — each stage feeds the next</text>

  <!-- Outer ring -->
  <circle cx="600" cy="430" r="260" fill="none" stroke="#00f0ff" stroke-opacity="0.06" stroke-width="50"/>
  <circle cx="600" cy="430" r="260" fill="none" stroke="#00f0ff" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="10,5"/>
  
  <!-- 8 stages around the circle -->
  <!-- Stage 1: Coverage (top) -->
  <rect x="520" y="130" width="160" height="55" rx="6" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="600" y="155" text-anchor="middle" fill="#00f0ff" font-size="11" font-weight="bold">① COVERAGE</text>
  <text x="600" y="173" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">WiFi DP devices deployed</text>
  
  <!-- Stage 2: Advertisers (top-right) -->
  <rect x="770" y="200" width="160" height="55" rx="6" fill="#f0c040" fill-opacity="0.12" stroke="#f0c040" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="850" y="225" text-anchor="middle" fill="#f0c040" font-size="11" font-weight="bold">② ADVERTISERS</text>
  <text x="850" y="243" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">Brands buy impressions</text>

  <!-- Stage 3: Revenue (right) -->
  <rect x="830" y="370" width="160" height="55" rx="6" fill="#40f080" fill-opacity="0.12" stroke="#40f080" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="910" y="395" text-anchor="middle" fill="#40f080" font-size="11" font-weight="bold">③ REVENUE</text>
  <text x="910" y="413" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">A.R.E. fiat income</text>

  <!-- Stage 4: Distribution (bottom-right) -->
  <rect x="770" y="545" width="160" height="55" rx="6" fill="#a060ff" fill-opacity="0.12" stroke="#a060ff" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="850" y="570" text-anchor="middle" fill="#a060ff" font-size="11" font-weight="bold">④ DISTRIBUTION</text>
  <text x="850" y="588" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">60% to DAO members</text>

  <!-- Stage 5: Participants (bottom) -->
  <rect x="520" y="630" width="160" height="55" rx="6" fill="#ff6080" fill-opacity="0.12" stroke="#ff6080" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="600" y="655" text-anchor="middle" fill="#ff6080" font-size="11" font-weight="bold">⑤ PARTICIPANTS</text>
  <text x="600" y="673" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">More people join DAOs</text>

  <!-- Stage 6: Governance (bottom-left) -->
  <rect x="270" y="545" width="160" height="55" rx="6" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="350" y="570" text-anchor="middle" fill="#00f0ff" font-size="11" font-weight="bold">⑥ GOVERNANCE</text>
  <text x="350" y="588" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">Better DAO decisions</text>

  <!-- Stage 7: Content (left) -->
  <rect x="210" y="370" width="160" height="55" rx="6" fill="#f0c040" fill-opacity="0.12" stroke="#f0c040" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="290" y="395" text-anchor="middle" fill="#f0c040" font-size="11" font-weight="bold">⑦ CONTENT</text>
  <text x="290" y="413" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">Better AR experiences</text>

  <!-- Stage 8: Engagement (top-left) -->
  <rect x="270" y="200" width="160" height="55" rx="6" fill="#40f080" fill-opacity="0.12" stroke="#40f080" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="350" y="225" text-anchor="middle" fill="#40f080" font-size="11" font-weight="bold">⑧ ENGAGEMENT</text>
  <text x="350" y="243" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.5">Higher eCPM + dwell</text>

  <!-- Circular flow arrows -->
  <path d="M 680 155 Q 770 140 770 210" fill="none" stroke="#00f0ff" stroke-width="1.5" marker-end="url(#arrowC)" opacity="0.4"/>
  <path d="M 920 255 Q 960 310 920 370" fill="none" stroke="#00f0ff" stroke-width="1.5" marker-end="url(#arrowC)" opacity="0.4"/>
  <path d="M 920 425 Q 940 490 870 545" fill="none" stroke="#00f0ff" stroke-width="1.5" marker-end="url(#arrowC)" opacity="0.4"/>
  <path d="M 770 580 Q 700 620 680 640" fill="none" stroke="#00f0ff" stroke-width="1.5" marker-end="url(#arrowC)" opacity="0.4"/>
  <path d="M 520 660 Q 450 670 430 600" fill="none" stroke="#00f0ff" stroke-width="1.5" marker-end="url(#arrowC)" opacity="0.4"/>
  <path d="M 310 545 Q 260 490 270 425" fill="none" stroke="#00f0ff" stroke-width="1.5" marker-end="url(#arrowC)" opacity="0.4"/>
  <path d="M 310 370 Q 280 310 310 255" fill="none" stroke="#00f0ff" stroke-width="1.5" marker-end="url(#arrowC)" opacity="0.4"/>
  <path d="M 430 210 Q 490 160 520 155" fill="none" stroke="#00f0ff" stroke-width="1.5" marker-end="url(#arrowC)" opacity="0.4"/>

  <!-- Center -->
  <circle cx="600" cy="430" r="55" fill="#0a0a14" stroke="#00f0ff" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="600" y="420" text-anchor="middle" fill="#00f0ff" font-size="12" font-weight="bold">LAYER U</text>
  <text x="600" y="438" text-anchor="middle" fill="#00f0ff" font-size="12" font-weight="bold">FLYWHEEL</text>
  <text x="600" y="453" text-anchor="middle" fill="#ffffff" font-size="9" opacity="0.4">Self-reinforcing</text>

  <!-- Bottom insight -->
  <rect x="100" y="720" width="1000" height="45" rx="4" fill="#ffffff" fill-opacity="0.03" stroke="#f0c040" stroke-opacity="0.3" stroke-width="1"/>
  <text x="600" y="740" text-anchor="middle" fill="#f0c040" font-size="12" font-weight="bold">EACH REVOLUTION INCREASES ALL VALUES: More coverage → more advertisers → more revenue → more participants → better content → higher eCPM</text>
  <text x="1170" y="780" text-anchor="end" fill="#ffffff" font-size="10" opacity="0.3">Fig. 17</text>
</svg>
