<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a0a14"/><stop offset="100%" stop-color="#06060c"/></linearGradient>
  </defs>
  <rect width="1100" height="550" fill="url(#bg)"/>
  <text x="550" y="42" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="2">$KREDS BRIDGE MECHANISM</text>
  <text x="550" y="64" text-anchor="middle" fill="#40f080" font-size="11" letter-spacing="4" opacity="0.7">GAME ECONOMY → LAYER U → STRANDS CHAIN — CHAPTER 13</text>
  <line x1="280" y1="76" x2="820" y2="76" stroke="#40f080" stroke-width="0.5" opacity="0.3"/>

  <!-- Layer 1: Game -->
  <rect x="60" y="110" width="300" height="260" rx="6" fill="#00f0ff" fill-opacity="0.03" stroke="#00f0ff" stroke-width="0.8"/>
  <rect x="60" y="110" width="300" height="32" rx="6" fill="#00f0ff" fill-opacity="0.1"/>
  <text x="210" y="131" text-anchor="middle" fill="#00f0ff" font-size="13" font-weight="700">GAME ECONOMY (FIAT)</text>
  <text x="80" y="165" fill="#ffffff" font-size="10">▸ UBC (Energy) — soft currency</text>
  <text x="80" y="185" fill="#ffffff" font-size="10">▸ UBComp (Process Power) — soft</text>
  <text x="80" y="205" fill="#ffffff" font-size="10">▸ Marketplace transactions</text>
  <text x="80" y="225" fill="#ffffff" font-size="10">▸ IAP purchases via TON Pay</text>
  <line x1="80" y1="245" x2="340" y2="245" stroke="#00f0ff" stroke-width="0.2" opacity="0.3"/>
  <text x="80" y="268" fill="#a0a8b8" font-size="9">NO BLOCKCHAIN REQUIRED</text>
  <text x="80" y="286" fill="#a0a8b8" font-size="9">Players don't need wallets to play</text>
  <text x="80" y="304" fill="#a0a8b8" font-size="9">Standard game economy (fiat-backed)</text>
  <rect x="80" y="320" width="260" height="22" rx="11" fill="#00f0ff" fill-opacity="0.06" stroke="#00f0ff" stroke-width="0.4"/>
  <text x="210" y="335" text-anchor="middle" fill="#00f0ff" font-size="9" font-weight="600">ENTRY POINT: 100% of players</text>

  <!-- Bridge arrows -->
  <text x="390" y="200" fill="#ffffff" font-size="14" opacity="0.4">→</text>
  <text x="390" y="220" fill="#a0a8b8" font-size="8">20% Layer U</text>
  <text x="390" y="232" fill="#a0a8b8" font-size="8">revenue feeds</text>
  <text x="390" y="244" fill="#a0a8b8" font-size="8">$KREDS buy</text>

  <!-- Layer 2: Layer U -->
  <rect x="420" y="110" width="260" height="260" rx="6" fill="#f0c040" fill-opacity="0.03" stroke="#f0c040" stroke-width="0.8"/>
  <rect x="420" y="110" width="260" height="32" rx="6" fill="#f0c040" fill-opacity="0.1"/>
  <text x="550" y="131" text-anchor="middle" fill="#f0c040" font-size="13" font-weight="700">LAYER U (DAO)</text>
  <text x="440" y="165" fill="#ffffff" font-size="10">▸ XR ad space revenue</text>
  <text x="440" y="185" fill="#ffffff" font-size="10">▸ DAO treasury (fiat)</text>
  <text x="440" y="205" fill="#ffffff" font-size="10">▸ B2B data licensing</text>
  <text x="440" y="225" fill="#ffffff" font-size="10">▸ Creator commissions</text>
  <line x1="440" y1="245" x2="660" y2="245" stroke="#f0c040" stroke-width="0.2" opacity="0.3"/>
  <text x="440" y="268" fill="#a0a8b8" font-size="9">FIAT + DAO TOKEN HYBRID</text>
  <text x="440" y="286" fill="#a0a8b8" font-size="9">Ltd entity handles fiat</text>
  <text x="440" y="304" fill="#a0a8b8" font-size="9">DAO handles governance</text>
  <rect x="440" y="320" width="240" height="22" rx="11" fill="#f0c040" fill-opacity="0.06" stroke="#f0c040" stroke-width="0.4"/>
  <text x="560" y="335" text-anchor="middle" fill="#f0c040" font-size="9" font-weight="600">BRIDGE: Revenue → $KREDS buy</text>

  <!-- Bridge arrows -->
  <text x="710" y="200" fill="#ffffff" font-size="14" opacity="0.4">→</text>
  <text x="710" y="220" fill="#a0a8b8" font-size="8">20% of DAO</text>
  <text x="710" y="232" fill="#a0a8b8" font-size="8">revenue buys</text>
  <text x="710" y="244" fill="#a0a8b8" font-size="8">$KREDS on DEX</text>

  <!-- Layer 3: $KREDS -->
  <rect x="750" y="110" width="290" height="260" rx="6" fill="#40f080" fill-opacity="0.03" stroke="#40f080" stroke-width="0.8"/>
  <rect x="750" y="110" width="290" height="32" rx="6" fill="#40f080" fill-opacity="0.1"/>
  <text x="895" y="131" text-anchor="middle" fill="#40f080" font-size="13" font-weight="700">$KREDS CHAIN (TOKEN)</text>
  <text x="770" y="165" fill="#ffffff" font-size="10">▸ Independent Layer 1</text>
  <text x="770" y="185" fill="#ffffff" font-size="10">▸ DPoS + Proof of Personhood</text>
  <text x="770" y="205" fill="#ffffff" font-size="10">▸ UBI distribution mechanism</text>
  <text x="770" y="225" fill="#ffffff" font-size="10">▸ Device-level validation</text>
  <line x1="770" y1="245" x2="1020" y2="245" stroke="#40f080" stroke-width="0.2" opacity="0.3"/>
  <text x="770" y="268" fill="#a0a8b8" font-size="9">TRUE VALUE LAUNCH</text>
  <text x="770" y="286" fill="#a0a8b8" font-size="9">Revenue-backed buy pressure</text>
  <text x="770" y="304" fill="#a0a8b8" font-size="9">0% VC allocation, no presale</text>
  <rect x="770" y="320" width="250" height="22" rx="11" fill="#40f080" fill-opacity="0.06" stroke="#40f080" stroke-width="0.4"/>
  <text x="895" y="335" text-anchor="middle" fill="#40f080" font-size="9" font-weight="600">DESTINATION: UBI for all participants</text>

  <!-- Key principle -->
  <rect x="60" y="400" width="980" height="50" rx="4" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-width="0.4"/>
  <text x="550" y="422" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">THREE LAYERS, THREE PURPOSES, ONE DIRECTION</text>
  <text x="550" y="441" text-anchor="middle" fill="#a0a8b8" font-size="10">Game generates attention → Layer U converts to revenue → $KREDS distributes as universal income. Each layer is independent but feeds the next.</text>

  <!-- Anti-death-spiral -->
  <rect x="60" y="465" width="980" height="40" rx="4" fill="#40f080" fill-opacity="0.03" stroke="#40f080" stroke-width="0.3"/>
  <text x="550" y="490" text-anchor="middle" fill="#40f080" font-size="10" font-weight="600">If any layer fails, the others survive. Game works without $KREDS. Layer U works without the game. $KREDS has value without Layer U.</text>

  <text x="1070" y="540" text-anchor="end" fill="#ffffff" font-size="9" opacity="0.2">Fig. 21</text>
</svg>