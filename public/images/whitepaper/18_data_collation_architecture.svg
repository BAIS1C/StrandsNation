<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a0a14"/><stop offset="100%" stop-color="#06060c"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#00f0ff"><line x1="0" y1="400" x2="1200" y2="400" stroke-dasharray="2,8"/><line x1="600" y1="0" x2="600" y2="800" stroke-dasharray="2,8"/></g>
  <text x="600" y="42" text-anchor="middle" fill="#00f0ff" font-size="11" letter-spacing="4" opacity="0.6">CHAPTER 12 — LAYER U</text>
  <text x="600" y="72" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold" letter-spacing="1">DATA COLLATION ARCHITECTURE</text>
  <text x="600" y="96" text-anchor="middle" fill="#ffffff" font-size="13" opacity="0.5">Four-way separation of knowledge — no single entity sees the full picture</text>

  <!-- 4 Quadrants -->
  <!-- Q1: Device Layer (top-left) -->
  <rect x="50" y="120" width="520" height="260" rx="8" fill="#00f0ff" fill-opacity="0.04" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="310" y="150" text-anchor="middle" fill="#00f0ff" font-size="16" font-weight="bold" filter="url(#glow)">① DEVICE LAYER</text>
  <text x="310" y="170" text-anchor="middle" fill="#00f0ff" font-size="10" opacity="0.6">On-device · Player-controlled · Encrypted</text>
  <rect x="70" y="185" width="220" height="40" rx="3" fill="#00f0ff" fill-opacity="0.06" stroke="#00f0ff" stroke-opacity="0.2"/>
  <text x="180" y="210" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.6">MyMories personal data vault</text>
  <rect x="70" y="235" width="220" height="40" rx="3" fill="#00f0ff" fill-opacity="0.04" stroke="#00f0ff" stroke-opacity="0.15"/>
  <text x="180" y="260" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.6">SAL psychometric model</text>
  <rect x="70" y="285" width="220" height="40" rx="3" fill="#00f0ff" fill-opacity="0.06" stroke="#00f0ff" stroke-opacity="0.2"/>
  <text x="180" y="310" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.6">Ollama local inference</text>
  <rect x="310" y="185" width="240" height="40" rx="3" fill="#00f0ff" fill-opacity="0.06" stroke="#00f0ff" stroke-opacity="0.2"/>
  <text x="430" y="210" text-anchor="middle" fill="#00f0ff" font-size="10" font-weight="bold">KNOWS: Identity, preferences</text>
  <rect x="310" y="235" width="240" height="40" rx="3" fill="#ff4060" fill-opacity="0.06" stroke="#ff4060" stroke-opacity="0.2"/>
  <text x="430" y="260" text-anchor="middle" fill="#ff4060" font-size="10" font-weight="bold">DOESN'T KNOW: Location data</text>
  <rect x="310" y="285" width="240" height="40" rx="3" fill="#ff4060" fill-opacity="0.04" stroke="#ff4060" stroke-opacity="0.15"/>
  <text x="430" y="310" text-anchor="middle" fill="#ff4060" font-size="10" font-weight="bold">DOESN'T KNOW: Ad content</text>
  <text x="310" y="365" text-anchor="middle" fill="#00f0ff" font-size="10" opacity="0.5">Player can export or delete at any time (.mmr file)</text>

  <!-- Q2: A.R.E. Layer (top-right) -->
  <rect x="630" y="120" width="520" height="260" rx="8" fill="#f0c040" fill-opacity="0.04" stroke="#f0c040" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="890" y="150" text-anchor="middle" fill="#f0c040" font-size="16" font-weight="bold" filter="url(#glow)">② A.R.E. LAYER</text>
  <text x="890" y="170" text-anchor="middle" fill="#f0c040" font-size="10" opacity="0.6">Ad matching · Category vectors only · No PII</text>
  <rect x="650" y="185" width="220" height="40" rx="3" fill="#f0c040" fill-opacity="0.06" stroke="#f0c040" stroke-opacity="0.2"/>
  <text x="760" y="210" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.6">Anonymous category vectors</text>
  <rect x="650" y="235" width="220" height="40" rx="3" fill="#f0c040" fill-opacity="0.04" stroke="#f0c040" stroke-opacity="0.15"/>
  <text x="760" y="260" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.6">Consent tier (0-3)</text>
  <rect x="650" y="285" width="220" height="40" rx="3" fill="#f0c040" fill-opacity="0.06" stroke="#f0c040" stroke-opacity="0.2"/>
  <text x="760" y="310" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.6">Ad impression counts</text>
  <rect x="890" y="185" width="240" height="40" rx="3" fill="#f0c040" fill-opacity="0.06" stroke="#f0c040" stroke-opacity="0.2"/>
  <text x="1010" y="210" text-anchor="middle" fill="#f0c040" font-size="10" font-weight="bold">KNOWS: Interest categories</text>
  <rect x="890" y="235" width="240" height="40" rx="3" fill="#ff4060" fill-opacity="0.06" stroke="#ff4060" stroke-opacity="0.2"/>
  <text x="1010" y="260" text-anchor="middle" fill="#ff4060" font-size="10" font-weight="bold">DOESN'T KNOW: Who you are</text>
  <rect x="890" y="285" width="240" height="40" rx="3" fill="#ff4060" fill-opacity="0.04" stroke="#ff4060" stroke-opacity="0.15"/>
  <text x="1010" y="310" text-anchor="middle" fill="#ff4060" font-size="10" font-weight="bold">DOESN'T KNOW: Physical location</text>
  <text x="890" y="365" text-anchor="middle" fill="#f0c040" font-size="10" opacity="0.5">60/40 revenue split — player always gets majority</text>

  <!-- Q3: WiFi DensePose (bottom-left) -->
  <rect x="50" y="410" width="520" height="260" rx="8" fill="#a060ff" fill-opacity="0.04" stroke="#a060ff" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="310" y="440" text-anchor="middle" fill="#a060ff" font-size="16" font-weight="bold" filter="url(#glow)">③ WiFi DENSEPOSE LAYER</text>
  <text x="310" y="460" text-anchor="middle" fill="#a060ff" font-size="10" opacity="0.6">Physical measurement · Camera-free · Aggregate only</text>
  <rect x="70" y="475" width="220" height="40" rx="3" fill="#a060ff" fill-opacity="0.06" stroke="#a060ff" stroke-opacity="0.2"/>
  <text x="180" y="500" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.6">Pedestrian count + flow</text>
  <rect x="70" y="525" width="220" height="40" rx="3" fill="#a060ff" fill-opacity="0.04" stroke="#a060ff" stroke-opacity="0.15"/>
  <text x="180" y="550" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.6">Dwell time estimation</text>
  <rect x="70" y="575" width="220" height="40" rx="3" fill="#a060ff" fill-opacity="0.06" stroke="#a060ff" stroke-opacity="0.2"/>
  <text x="180" y="600" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.6">Body pose (anonymised)</text>
  <rect x="310" y="475" width="240" height="40" rx="3" fill="#a060ff" fill-opacity="0.06" stroke="#a060ff" stroke-opacity="0.2"/>
  <text x="430" y="500" text-anchor="middle" fill="#a060ff" font-size="10" font-weight="bold">KNOWS: How many people</text>
  <rect x="310" y="525" width="240" height="40" rx="3" fill="#ff4060" fill-opacity="0.06" stroke="#ff4060" stroke-opacity="0.2"/>
  <text x="430" y="550" text-anchor="middle" fill="#ff4060" font-size="10" font-weight="bold">DOESN'T KNOW: Who they are</text>
  <rect x="310" y="575" width="240" height="40" rx="3" fill="#ff4060" fill-opacity="0.04" stroke="#ff4060" stroke-opacity="0.15"/>
  <text x="430" y="600" text-anchor="middle" fill="#ff4060" font-size="10" font-weight="bold">DOESN'T KNOW: Their interests</text>
  <text x="310" y="655" text-anchor="middle" fill="#a060ff" font-size="10" opacity="0.5">ESP32-S3 hardware · Rust signal processing · No cameras ever</text>

  <!-- Q4: Advertiser Layer (bottom-right) -->
  <rect x="630" y="410" width="520" height="260" rx="8" fill="#40f080" fill-opacity="0.04" stroke="#40f080" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="890" y="440" text-anchor="middle" fill="#40f080" font-size="16" font-weight="bold" filter="url(#glow)">④ ADVERTISER LAYER</text>
  <text x="890" y="460" text-anchor="middle" fill="#40f080" font-size="10" opacity="0.6">Brand partners · Category targeting · Aggregate reporting</text>
  <rect x="650" y="475" width="220" height="40" rx="3" fill="#40f080" fill-opacity="0.06" stroke="#40f080" stroke-opacity="0.2"/>
  <text x="760" y="500" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.6">Campaign impressions count</text>
  <rect x="650" y="525" width="220" height="40" rx="3" fill="#40f080" fill-opacity="0.04" stroke="#40f080" stroke-opacity="0.15"/>
  <text x="760" y="550" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.6">Category match rates</text>
  <rect x="650" y="575" width="220" height="40" rx="3" fill="#40f080" fill-opacity="0.06" stroke="#40f080" stroke-opacity="0.2"/>
  <text x="760" y="600" text-anchor="middle" fill="#ffffff" font-size="10" opacity="0.6">Aggregate performance data</text>
  <rect x="890" y="475" width="240" height="40" rx="3" fill="#40f080" fill-opacity="0.06" stroke="#40f080" stroke-opacity="0.2"/>
  <text x="1010" y="500" text-anchor="middle" fill="#40f080" font-size="10" font-weight="bold">KNOWS: Campaign results</text>
  <rect x="890" y="525" width="240" height="40" rx="3" fill="#ff4060" fill-opacity="0.06" stroke="#ff4060" stroke-opacity="0.2"/>
  <text x="1010" y="550" text-anchor="middle" fill="#ff4060" font-size="10" font-weight="bold">DOESN'T KNOW: Individual users</text>
  <rect x="890" y="575" width="240" height="40" rx="3" fill="#ff4060" fill-opacity="0.04" stroke="#ff4060" stroke-opacity="0.15"/>
  <text x="1010" y="600" text-anchor="middle" fill="#ff4060" font-size="10" font-weight="bold">DOESN'T KNOW: Personal data</text>
  <text x="890" y="655" text-anchor="middle" fill="#40f080" font-size="10" opacity="0.5">Advertisers pay for verified attention, not surveillance data</text>

  <!-- Bottom insight -->
  <rect x="100" y="710" width="1000" height="55" rx="4" fill="#ffffff" fill-opacity="0.03" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="600" y="732" text-anchor="middle" fill="#00f0ff" font-size="12" font-weight="bold">GDPR-COMPLIANT BY ARCHITECTURE, NOT BY POLICY</text>
  <text x="600" y="752" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.6">No single layer can reconstruct the full picture. Privacy isn't a promise — it's a structural impossibility to violate.</text>
  <text x="1170" y="780" text-anchor="end" fill="#ffffff" font-size="10" opacity="0.3">Fig. 18</text>
</svg>
